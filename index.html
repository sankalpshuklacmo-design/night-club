<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>After Dark Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="chrome-header"></div>
  <section class="hero">
    <div class="hero-media">
      <video autoplay muted loop playsinline poster="crowd.jpg">
        <source src="hero-crowd.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="hero-content">
      <p class="kicker">India's nightlife destination</p>
    <h1 style="font-size:clamp(3rem,9vw,6rem);letter-spacing:.06em">AFTER DARK<br><em>SOCIETY</em></h1>
      <p class="lead">Discover the best clubs, parties, DJs and nightlife events happening near you.</p>
      <form class="hero-search" id="heroForm">
        <select id="heroCity"></select>
        <input id="heroQ" placeholder="Search clubs, DJs, parties..." />
        <button class="btn btn-primary" type="submit">Explore Tonight</button>
      </form>
    </div>
  </section>
  <section>
    <div class="container">
      <div class="section-head">
        <div><p class="kicker">Venues</p><h2>Explore Clubs</h2></div>
        <a class="btn btn-ghost" href="clubs.html">See all</a>
      </div>
      <div class="grid grid-3" id="homeClubs"></div>
    </div>
  </section>
  <section style="padding-top:0">
    <div class="container">
      <div class="section-head">
        <div><p class="kicker">Calendar</p><h2>Pick a marked night</h2></div>
      </div>
      <div class="ads-cal" id="homeCal"></div>
    </div>
  </section>
  <section id="cities" style="padding-top:0">
    <div class="container">
      <div class="section-head">
        <div><p class="kicker">Destinations</p><h2>Explore Nightlife by City</h2></div>
      </div>
      <div class="grid grid-3" id="homeCities"></div>
    </div>
  </section>
  <div id="chrome-footer"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("chrome-header").innerHTML = npHeader("home");
    document.getElementById("chrome-footer").innerHTML = npFooter();
    bindChrome();
    const city = NP.getCity() || "all";
    const heroCity = document.getElementById("heroCity");
    heroCity.innerHTML = '<option value="all">All Cities</option><option value="ncr">NCR</option>' + NP_DATA.cities.map(c => '<option value="'+c.id+'" '+(c.id===city?'selected':'')+'>'+c.name+'</option>').join("");
    document.getElementById("homeCities").innerHTML = NP_DATA.cities.map(cityCard).join("");
    document.getElementById("homeClubs").innerHTML = filterClubs({ city: city }).map(clubCard).join("");
    heroCity.onchange = function(){ NP.setCity(heroCity.value); location.reload(); };
    (function(){
      var box = document.getElementById("homeCal");
      var now = new Date(), y = now.getFullYear(), m = now.getMonth();
      var first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
      var html = "<div class='ads-cal-head'>S M T W T F S</div><div class='ads-cal-grid'>";
      for (var i=0;i<first;i++) html += "<span></span>";
      for (var d=1;d<=days;d++){
        var key = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
        if ([5,6,12,13,19,20,26,27].indexOf(d)>=0)
          html += '<a class="ads-cal-mark" href="book-date.html?date='+key+'">'+d+'</a>';
        else html += "<span>"+d+"</span>";
      }
      box.innerHTML = html+"</div>";
    })();
    document.getElementById("heroForm").onsubmit = function(e){
      e.preventDefault();
      NP.setCity(heroCity.value);
      location.href = "clubs.html?city="+heroCity.value;
    };
  </script>
</body>
</html>
