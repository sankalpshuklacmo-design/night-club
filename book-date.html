<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marked night — After Dark Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Manrope:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .svc-box { margin-top:18px;padding:18px;border:1px solid #2a2a2a;border-radius:14px;background:#101010 }
    .svc-item { display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222 }
    .svc-item label { display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer }
    .pay-bar { display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:16px }
    .pay-bar strong { font-size:1.4rem;color:#ff5a00 }
  </style>
</head>
<body>
  <div id="chrome-header"></div>
  <section>
    <div class="container" style="max-width:720px">
      <p class="kicker">Pick a marked night</p>
      <h2 id="dateTitle">Night details</h2>
      <div class="filter-panel" style="margin-top:16px">
        <div><label>No. of persons</label><input id="dPeople" type="number" min="1" value="1"></div>
        <div><label>Name</label><input id="dName"></div>
        <div><label>WhatsApp</label><input id="dPhone" type="tel" placeholder="+91"></div>
      </div>
      <div class="svc-box">
        <h3>Special services</h3>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="3000"> a) Dedicated Table</label><span>₹3,000</span></div>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="8000"> b) 2 female dance partners</label><span>₹8,000</span></div>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="2500"> c) One bucket beer</label><span>₹2,500</span></div>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="2000"> d) Fire gun shot</label><span>₹2,000</span></div>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="5000"> e) Bouncer / escort</label><span>₹5,000</span></div>
        <div class="svc-item"><label><input type="checkbox" id="svcPack"> f) All pack</label><span>₹25,000</span></div>
        <div class="pay-bar">
          <div>
            <p class="meta" id="priceLine">₹1,500 × 1</p>
            <strong id="grand">₹1,500</strong>
          </div>
          <button class="btn btn-primary" type="button" id="payNow">Pay with Razorpay</button>
        </div>
      </div>
    </div>
  </section>
  <div id="chrome-footer"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("chrome-header").innerHTML = npHeader("home");
    document.getElementById("chrome-footer").innerHTML = npFooter();
    bindChrome();
    var date = new URLSearchParams(location.search).get("date") || "";
    document.getElementById("dateTitle").textContent = date ? ("Night of " + date) : "Marked night";
    function extra() {
      if (document.getElementById("svcPack").checked) {
        document.querySelectorAll(".svc").forEach(function(c){ c.checked = true; });
        return 25000;
      }
      var n = 0;
      document.querySelectorAll(".svc").forEach(function(c){ if (c.checked) n += Number(c.dataset.price); });
      return n;
    }
    function totals() {
      var people = Math.max(1, Number(document.getElementById("dPeople").value || 1));
      var svc = extra();
      var cover = svc > 0 ? 0 : 1500 * people;
      var grand = cover + svc;
      document.getElementById("priceLine").textContent = svc ? ("Service ₹" + svc) : ("₹1,500 × " + people);
      document.getElementById("grand").textContent = "₹" + grand;
      return grand;
    }
    document.getElementById("dPeople").oninput = totals;
    document.querySelectorAll(".svc, #svcPack").forEach(function(el){ el.onchange = totals; });
    document.getElementById("payNow").onclick = function(){
      document.getElementById("bkName").value = document.getElementById("dName").value;
      document.getElementById("bkPhone").value = document.getElementById("dPhone").value;
      document.getElementById("bkPeople").value = document.getElementById("dPeople").value;
      document.getElementById("bkDate").value = date;
      document.getElementById("bkAmount").value = totals();
      document.getElementById("bookModal").classList.add("open");
    };
    totals();
  </script>
</body>
</html>
