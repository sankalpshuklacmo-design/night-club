<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parties — After Dark Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Manrope:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="chrome-header"></div>
  <section>
    <div class="container">
      <p class="kicker">Parties</p>
      <h2>Events</h2>
      <p class="meta" style="margin:8px 0 18px">Sirf admin ke add kiye events.</p>
      <a class="btn btn-ghost" href="list-event.html">List your event</a>
      <div class="grid grid-3" id="list" style="margin-top:20px"></div>
    </div>
  </section>
  <div id="chrome-footer"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("chrome-header").innerHTML = npHeader("events");
    document.getElementById("chrome-footer").innerHTML = npFooter();
    bindChrome();
    var rows = npAllEvents();
    document.getElementById("list").innerHTML = rows.length
      ? rows.map(eventCard).join("")
      : "<p class='meta'>Koi event nahi. Admin se add karo.</p>";
  </script>
</body>
</html>
