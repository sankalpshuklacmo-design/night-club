<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find a room — After Dark Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Manrope:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="chrome-header"></div>
  <section>
    <div class="container">
      <p class="kicker">Explore tonight</p>
      <h2>Find a room</h2>
      <div class="filter-panel">
        <div><label>City</label><select id="fCity"></select></div>
        <div><label>Area</label>
          <select id="fArea">
            <option value="all">All areas</option>
            <option value="ncr">NCR</option>
          </select>
        </div>
        <div><label>Distance</label>
          <select id="fKm">
            <option value="all">Any</option>
            <option value="5">5 km</option>
            <option value="10">10 km</option>
            <option value="20">20 km</option>
          </select>
        </div>
        <div><label>Search</label><input id="fQ" placeholder="Club, DJ..."></div>
      </div>
      <div class="grid grid-3" id="list"></div>
    </div>
  </section>
  <div id="chrome-footer"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("chrome-header").innerHTML = npHeader("clubs");
    document.getElementById("chrome-footer").innerHTML = npFooter();
    bindChrome();
    var fCity = document.getElementById("fCity");
    fCity.innerHTML = '<option value="all">All Cities</option><option value="ncr">NCR</option>' +
      NP_DATA.cities.map(function(c){ return '<option value="'+c.id+'">'+c.name+'</option>'; }).join("");
    function render() {
      var v = document.getElementById("fArea").value === "ncr" ? "ncr" : fCity.value;
      document.getElementById("list").innerHTML = filterClubs({ city: v, q: document.getElementById("fQ").value }).map(clubCard).join("");
    }
    document.querySelectorAll("#fCity,#fArea,#fKm,#fQ").forEach(function(el){
      el.addEventListener("input", render); el.addEventListener("change", render);
    });
    render();
  </script>
</body>
</html>
