<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore Tonight — After Dark Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .svc-box { margin-top: 18px; padding: 18px; border: 1px solid #2a2a2a; border-radius: 14px; background: #101010; }
    .svc-box h3 { font-family: Oswald, sans-serif; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 12px; }
    .svc-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #222; }
    .svc-item label { display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; }
    .pay-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .pay-bar strong { font-size: 1.4rem; color: #ff5a00; }
  </style>
</head>
<body>
  <div id="chrome-header"></div>
  <section>
    <div class="container">
      <p class="kicker">Explore tonight</p>
      <h2>Find a room</h2>
      <div class="filter-panel">
        <div><label>City</label><select id="fCity"></select></div>
        <div><label>Area</label>
          <select id="fArea">
            <option value="all">All areas</option>
            <option value="ncr">NCR</option>
          </select>
        </div>
        <div><label>Distance</label>
          <select id="fKm">
            <option value="all">Any range</option>
            <option value="5">Within 5 km</option>
            <option value="10">Within 10 km</option>
            <option value="20">Within 20 km</option>
            <option value="30">Within 30 km</option>
          </select>
        </div>
        <div><label>No. of persons</label><input id="fPeople" type="number" min="1" value="1"></div>
        <div><label>Search</label><input id="fQ" placeholder="Club, DJ..."></div>
      </div>
      <div class="svc-box">
        <h3>Special services — pick what you want</h3>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="3000"> a) Dedicated Table</label><span>₹3,000</span></div>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="1500"> b) Name on the screen</label><span>₹1,500</span></div>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="8000"> c) 2 female dance partners</label><span>₹8,000</span></div>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="2500"> d) One bucket beer</label><span>₹2,500</span></div>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="2000"> e) Fire gun shot</label><span>₹2,000</span></div>
        <div class="svc-item"><label><input type="checkbox" class="svc" data-price="5000"> f) Bouncer / escort</label><span>₹5,000</span></div>
        <div class="svc-item"><label><input type="checkbox" id="svcPack"> g) All pack</label><span>₹25,000</span></div>
        <div class="pay-bar">
          <div>
            <p class="meta" id="priceLine">₹1,500 × 1</p>
            <strong id="grand">₹1,500</strong>
          </div>
          <button class="btn btn-primary" type="button" id="payNow">Pay with Razorpay</button>
        </div>
      </div>
      <div class="grid grid-3" id="list" style="margin-top:28px"></div>
    </div>
  </section>
  <div id="chrome-footer"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("chrome-header").innerHTML = npHeader("clubs");
    document.getElementById("chrome-footer").innerHTML = npFooter();
    bindChrome();
    var city = NP.qs("city") || NP.getCity() || "all";
    var fCity = document.getElementById("fCity");
    fCity.innerHTML = '<option value="all">All Cities</option><option value="ncr">NCR</option>' +
      NP_DATA.cities.map(function(c){ return '<option value="'+c.id+'">'+c.name+'</option>'; }).join("");
    fCity.value = city;
    function extra() {
      if (document.getElementById("svcPack").checked) {
        document.querySelectorAll(".svc").forEach(function(c){ c.checked = true; });
        return 25000;
      }
      var n = 0;
      document.querySelectorAll(".svc").forEach(function(c){ if (c.checked) n += Number(c.dataset.price); });
      return n;
    }
    function totals() {
      var people = Math.max(1, Number(document.getElementById("fPeople").value || 1));
      var svc = extra();
      var cover = svc > 0 ? 0 : 1500 * people;
      var grand = cover + svc;
      document.getElementById("priceLine").textContent = svc ? ("Service ₹" + svc) : ("₹1,500 × " + people);
      document.getElementById("grand").textContent = "₹" + grand;
      return grand;
    }
    function render() {
      totals();
      var v = document.getElementById("fArea").value === "ncr" ? "ncr" : fCity.value;
      document.getElementById("list").innerHTML = filterClubs({ city: v, q: document.getElementById("fQ").value }).map(clubCard).join("");
    }
    document.querySelectorAll("input, select").forEach(function(el){ el.addEventListener("change", render); el.addEventListener("input", render); });
    document.getElementById("payNow").onclick = function(){
      document.getElementById("bkPeople").value = document.getElementById("fPeople").value;
      document.getElementById("bkAmount").value = totals();
      document.getElementById("bookModal").classList.add("open");
    };
    render();
  </script>
</body>
</html>
