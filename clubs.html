<!DOCTYPE html>
<html lang="en">
<head>

  <title>Explore Tonight — After Dark Society</title>

  <style>
    .svc-box { margin-top: 18px; padding: 18px; border: 1px solid #2a2a2a; border-radius: 14px; background: #101010; }

    .svc-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #222; }
    .svc-item label { display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; }
    .pay-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .pay-bar strong { font-size: 1.4rem; color: #ff5a00; }
  </style>
</head>
