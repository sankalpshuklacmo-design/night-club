<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore Tonight — After Dark Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="chrome-header"></div>
  <section>
    <div class="container">
      <p class="kicker">Explore tonight</p>
      <h2>Find a room</h2>
      <div class="filter-panel">
        <div><label>City</label><select id="fCity"></select></div>
        <div><label>Area</label>
          <select id="fArea">
            <option value="all">All areas</option>
            <option value="ncr">NCR</option>
          </select>
        </div>
        <div><label>Distance</label>
          <select id="fKm">
            <option value="all">Any range</option>
            <option value="5">Within 5 km</option>
            <option value="10">Within 10 km</option>
            <option value="20">Within 20 km</option>
            <option value="30">Within 30 km</option>
          </select>
        </div>
        <div><label>No. of persons</label><input id="fPeople" type="number" min="1" value="2"></div>
        <div><label>Price</label><input id="fPriceShow" readonly value="₹3,000"></div>
        <div><label>Special service</label>
          <select id="fService">
            <option value="0" data-price="0">None</option>
            <option value="table" data-price="3000">a) Dedicated Table — ₹3,000</option>
            <option value="screen" data-price="1500">b) Name on the screen — ₹1,500</option>
            <option value="dance" data-price="8000">c) 2 female dance partners — ₹8,000</option>
            <option value="beer" data-price="2500">d) One bucket beer — ₹2,500</option>
            <option value="fire" data-price="2000">e) Fire gun shot — ₹2,000</option>
            <option value="escort" data-price="5000">f) Bouncer / escort — ₹5,000</option>
            <option value="pack" data-price="25000">g) All services pack — ₹25,000</option>
          </select>
        </div>
        <div><label>Search</label><input id="fQ" placeholder="Club, DJ..."></div>
      </div>
      <p class="meta" id="priceLine">₹1,500 × 2 guests = ₹3,000</p>
      <div class="grid grid-3" id="list"></div>
    </div>
  </section>
  <div id="chrome-footer"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("chrome-header").innerHTML = npHeader("clubs");
    document.getElementById("chrome-footer").innerHTML = npFooter();
    bindChrome();
    var city = (NP.qs("city") || NP.getCity() || "all");
    if (NP.qs("city")) NP.setCity(NP.qs("city"));
    var fCity = document.getElementById("fCity");
    fCity.innerHTML = '<option value="all">All Cities</option><option value="ncr">NCR</option>' +
      NP_DATA.cities.map(function(c){ return '<option value="'+c.id+'"'+(c.id===city?' selected':'')+'>'+c.name+'</option>'; }).join("");
    function priceSync() {
      var people = Math.max(1, Number(document.getElementById("fPeople").value || 1));
      var sel = document.getElementById("fService");
      var extra = Number(sel.options[sel.selectedIndex].dataset.price || 0);
      var total = sel.value === "pack" ? 25000 : 1500 * people + extra;
      document.getElementById("fPriceShow").value = "₹" + total.toLocaleString("en-IN");
      document.getElementById("priceLine").textContent = sel.value === "pack"
        ? "All 6 services pack = ₹25,000"
        : ("₹1,500 × " + people + " + service = ₹" + total.toLocaleString("en-IN"));
    }
    function render() {
      priceSync();
      var cityVal = fCity.value;
      if (document.getElementById("fArea").value === "ncr") cityVal = "ncr";
      var list = filterClubs({ city: cityVal, q: document.getElementById("fQ").value });
      document.getElementById("list").innerHTML = list.map(clubCard).join("") || "<p class='meta'>No clubs.</p>";
    }
    ["fCity","fArea","fKm","fPeople","fService","fQ"].forEach(function(id){
      document.getElementById(id).addEventListener("input", render);
      document.getElementById(id).addEventListener("change", render);
    });
    render();
  </script>
</body>
</html>
